name: Sync Asana → Artifact

on:
  schedule:
    - cron: '0 * * * *'   # cada hora, todos los días
  workflow_dispatch:        # también permite correr manualmente desde GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # necesario para hacer commit del HTML actualizado

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Pull desde Asana
        env:
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
        run: python sync_asana.py --pull

      - name: Commit y push cambios
        run: |
          git config --global user.name  "Asana Sync Bot"
          git config --global user.email "sync@parquetempisque.com"
          git add restricciones_data.json index.html
          git diff --staged --quiet && echo "Sin cambios" || \
            git commit -m "sync: Asana → $(date -u '+%Y-%m-%d %H:%M') UTC" && git push
